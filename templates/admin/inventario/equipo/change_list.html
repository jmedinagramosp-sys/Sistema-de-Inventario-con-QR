{% extends "admin/change_list.html" %}

{% block content %}
{% if kpis %}
<div class="kpi-grid">
  <div class="kpi-card kpi-total">
    <div class="kpi-icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </div>
    <div class="kpi-datos"><div class="kpi-numero">{{ kpis.total }}</div><div class="kpi-etiqueta">Total de Equipos</div></div>
  </div>

  <div class="kpi-card kpi-ok">
    <div class="kpi-icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="kpi-datos"><div class="kpi-numero">{{ kpis.operativos }}</div><div class="kpi-etiqueta">Equipos Operativos</div></div>
  </div>

  <div class="kpi-card kpi-rev">
    <div class="kpi-icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </div>
    <div class="kpi-datos"><div class="kpi-numero">{{ kpis.revision }}</div><div class="kpi-etiqueta">En Revisión</div></div>
  </div>

  <div class="kpi-card kpi-baja">
    <div class="kpi-icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </div>
    <div class="kpi-datos"><div class="kpi-numero">{{ kpis.baja }}</div><div class="kpi-etiqueta">De Baja</div></div>
  </div>
</div>
{% endif %}
{{ block.super }}
{% endblock %}
